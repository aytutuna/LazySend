name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test windows\LazySend.sln

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - name: Build
        run: ./gradlew assembleDebug --console=plain
      # The link client's tests run against a local TLS server; the screen tests render each screen and
      # write PNGs only when run through recordRoborazziDebug.
      - name: Test
        run: ./gradlew testDebugUnitTest --console=plain

  macos:
    # The link code in LazySendKit builds and is tested on the Mac; its tests start a TLS server on loopback.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test LazySendKit
        run: swift test --filter LazySendKitTests
