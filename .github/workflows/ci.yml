name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test windows\LazySend.sln

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
      - name: Build
        run: ./gradlew assembleDebug --console=plain
      # The link client's tests run against a local TLS server; the screen tests render each screen and
      # write PNGs only when run through recordRoborazziDebug.
      - name: Test
        run: ./gradlew testDebugUnitTest --console=plain

  macos:
    # The link code in LazySendKit and the server in LazySendServer build and are tested on the Mac; their tests run a
    # TLS server and phones on loopback.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test LazySendKit
        run: swift test --filter LazySendKitTests
      - name: Test LazySendServer
        run: swift test --filter LazySendServerTests
      # The Mac app's model tests, and its two screens written as PNGs.
      - name: Test LazySendMac
        run: swift test --filter LazySendMacTests
        env:
          LAZYSEND_SHOTS: ${{ runner.temp }}/mac-shots
      - name: Upload the Mac screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-screens
          path: ${{ runner.temp }}/mac-shots
          if-no-files-found: warn

  mac:
    # The sandboxed Mac App Store target (mac/project.yml), built on the image and Xcode macappstore.yml uploads with
    # (macos-26, Xcode 26.6), so a compiler or SDK break shows here and not at upload. Signed ad hoc, which still puts the
    # entitlements in the binary; the upload workflow signs it for real.
    needs: macos
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          if [ "$hash" != "$XCODEGEN_SHA256" ]; then
            echo "XcodeGen checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme LazySend-Package \
            -only-testing:LazySendMacTests \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO
      - name: Write the app's project
        run: xcodegen generate --spec mac/project.yml
      - name: Build the store target
        run: |
          set -o pipefail
          xcodebuild build \
            -project mac/LazySendMacApp.xcodeproj \
            -scheme LazySendMacApp \
            -configuration Release \
            -destination generic/platform=macOS \
            -derivedDataPath "$RUNNER_TEMP/mac-store" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
      - name: Check the bundle
        run: |
          app="$RUNNER_TEMP/mac-store/Build/Products/Release/Lazy Send.app"
          plutil -lint "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Resources/PrivacyInfo.xcprivacy"
          codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/entitlements.plist"
          cat "$RUNNER_TEMP/entitlements.plist"
          for key in app-sandbox network.client network.server files.user-selected.read-write files.downloads.read-write files.bookmarks.app-scope; do
            [ "$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.$key" "$RUNNER_TEMP/entitlements.plist")" = "true" ] \
              || { echo "Missing entitlement: $key"; exit 1; }
          done
          if /usr/libexec/PlistBuddy -c "Print :com.apple.security.get-task-allow" "$RUNNER_TEMP/entitlements.plist" >/dev/null 2>&1; then
            echo "get-task-allow is set"
            exit 1
          fi
          codesign -dv "$app" 2>&1 | grep -q "runtime"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist" | grep -qx "com.lazysend.lazysend"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$app/Contents/Info.plist" | grep -qx "Lazy Send"

  ios:
    needs: macos
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Pick the simulator
        id: simulator
        env:
          IOS_RUNTIME: '26.5'
          IOS_DEVICE: iPhone 17 Pro Max
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          wanted_runtime = tuple(int(part) for part in os.environ["IOS_RUNTIME"].split("."))
          wanted_device = os.environ["IOS_DEVICE"]
          family = wanted_device.split()[0]
          devices_found = []
          for runtime, entries in devices.items():
              if ".SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-"))
              for entry in entries:
                  if entry.get("isAvailable", False) and entry["name"].startswith(family):
                      devices_found.append((version, entry["name"], entry["udid"]))
          if not devices_found:
              sys.exit("No available %s simulator on this image." % family)
          exact = [d for d in devices_found if d[0] == wanted_runtime and d[1].startswith(wanted_device)]
          newest = max(d[0] for d in devices_found)
          latest = sorted(d for d in devices_found if d[0] == newest)
          preferred = [d for d in latest if d[1].startswith(wanted_device)]
          chosen = sorted(exact)[-1] if exact else (preferred or latest)[0]
          print("Simulator: %s, iOS %s, %s" % (chosen[1], ".".join(str(n) for n in chosen[0]), chosen[2]), file=sys.stderr)
          print("udid=%s" % chosen[2])
          PY
      - name: Boot the simulator
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
      # The iPhone hosts with the server, so its tests run here too
      - name: Unit tests on the Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme LazySend-Package \
            -only-testing:LazySendIOSTests \
            -only-testing:LazySendServerTests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          if [ "$hash" != "$XCODEGEN_SHA256" ]; then
            echo "XcodeGen checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Write the app's project
        run: xcodegen generate --spec ios/project.yml
      - name: Build the app for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ios/LazySendiOS.xcodeproj \
            -scheme LazySendiOS \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/app-build" \
            CODE_SIGNING_ALLOWED=NO
      - name: Run the UI tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project ios/LazySendiOS.xcodeproj \
            -scheme LazySendiOS \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/app-build" \
            -resultBundlePath "$RUNNER_TEMP/ios-app-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Export the screenshots
        if: always()
        run: |
          out="$RUNNER_TEMP/ios-screenshots"
          mkdir -p "$out"
          if [ ! -d "$RUNNER_TEMP/ios-app-tests.xcresult" ]; then
            echo "No app test results to export"
            exit 0
          fi
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/ios-app-tests.xcresult" \
            --output-path "$out"
          if [ -f "$out/manifest.json" ]; then
            python3 - "$out" <<'EOF'
          import json, os, re, sys
          out = sys.argv[1]
          with open(os.path.join(out, "manifest.json")) as f:
              tests = json.load(f)
          for test in tests:
              for attachment in test.get("attachments", []):
                  src = os.path.join(out, attachment.get("exportedFileName", ""))
                  name = attachment.get("suggestedHumanReadableName", "")
                  # The suggested name ends in "_<index>_<UUID>" before the extension.
                  name = re.sub(r"(_\d+)?_[0-9A-Fa-f-]{36}(?=\.\w+$)", "", name)
                  if not name or not src.endswith(".png") or not os.path.isfile(src):
                      continue
                  if not name.endswith(".png"):
                      name += ".png"
                  dst = os.path.join(out, name)
                  if not os.path.exists(dst):
                      os.rename(src, dst)
          EOF
          fi
          ls "$out"
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/ios-screenshots
          if-no-files-found: warn
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tests-xcresult
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ${{ runner.temp }}/ios-app-tests.xcresult
          if-no-files-found: ignore
